name: MarianaMobile
options:
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MarianaPhone:
    scheme: {}
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Phone
      - path: ../../build/apple-icons/ios.xcassets
        buildPhase: resources
      - path: ../../build/web-player
        name: web-player
        type: folder
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: org.marianaplayer.phone
        INFOPLIST_FILE: PhoneInfo.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mariana
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  MarianaWatch:
    scheme: {}
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Watch
      - path: ../../res/karaoke/practice-duet.wav
        buildPhase: resources
      - path: ../../res/karaoke/practice-duet.json
        buildPhase: resources
      - path: ../../mariana/theme_presets.json
        buildPhase: resources
      - path: ../../build/apple-icons/watchos.xcassets
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: org.marianaplayer.watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mariana
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        TARGETED_DEVICE_FAMILY: "4"
