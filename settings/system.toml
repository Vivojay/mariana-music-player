isdev = true

[about]
author = "vivojay"
date = "19-01-2021"
title = "Mariana CLI Music Player"

[ver]
maj = 0
min = 7
rel = 0

[system_settings]
enable_best_quality_downloads = 1
enforce_os_requirement = true
max_wait_limit_to_get_song_length = 15
supported_file_types = [
    ".wav",
    ".mp3",
    ".mka",
    ".mkv",
    ".mpeg",
    ".wma",
    ".amr",
    ".flac",
    ".alac",
    ".ogg",
    ".webm",
]
mariana_dl_dir = "MarianaPlayer"
brave_paths = [
    "C:\\Program Files\\BraveSoftware\\Brave-Browser\\Application\\brave.exe",
    "C:\\Program Files (x86)\\BraveSoftware\\Brave-Browser\\Application\\brave.exe",
]
max_recents_size=10_000_000 # 10 mil
supported_python_versions = [[3, 12], ]
# Public application identifier owned by the Mariana project. It is not a
# credential. Release builds must set this before Discord presence is enabled.
discord_application_id = ""
