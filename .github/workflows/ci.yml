name: CI

on:
  push:
  pull_request:

jobs:
  windows-python-312:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked development environment
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependency graph
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Check the complete source tree
        run: python -m ruff check .
      - name: Run tests
        run: >-
          python -m pytest -q
          --cov
          --cov-report=term-missing
          --cov-report=xml
          --cov-branch
          --cov-fail-under=80
      - name: Enforce resolver, library, and supervisor branch coverage
        run: >-
          python -m pytest -q
          tests/test_source_resolvers.py
          tests/test_library_indexer.py
          tests/test_library_edge_cases.py
          tests/test_library_service.py
          tests/test_playback_supervisor.py
          --cov=mariana.sources
          --cov=mariana.library
          --cov=mariana.library_service
          --cov=mariana.supervisor
          --cov-branch
          --cov-fail-under=95
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-python-312-coverage
          path: coverage.xml
          if-no-files-found: ignore
      - name: Import smoke test
        run: python -c "import main"
      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements.txt
