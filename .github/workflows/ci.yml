name: CI

on:
  push:
  pull_request:

jobs:
  windows-python-312:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked development environment
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependency graph
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Check critical syntax and name errors
        run: python -m ruff check --select E9,F63,F7,F82 .
      - name: Check modernized modules
        run: python -m ruff check config_manager.py runtime_check.py terminal_colors.py beta/ffmpeg_player.py beta/youtube_media.py mariana recommendation_engine tests
      - name: Run tests
        run: >-
          python -m pytest -q
          --cov
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=70
      - name: Enforce new-package branch coverage
        run: >-
          python -m pytest -q
          tests/test_ffmpeg_playback_core.py
          tests/test_playback_state_machine.py
          tests/test_real_media_pipeline.py
          tests/test_media_models_and_queue.py
          tests/test_identity_and_lyrics.py
          tests/test_radio_catalog.py
          tests/test_custom_download.py
          tests/test_recommendation_engine.py
          tests/test_optional_embeddings.py
          --cov=mariana
          --cov=recommendation_engine
          --cov-branch
          --cov-fail-under=90
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-python-312-coverage
          path: coverage.xml
          if-no-files-found: ignore
      - name: Import smoke test
        run: python -c "import main"
      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements.txt
