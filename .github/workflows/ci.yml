name: CI

on:
  push:
  pull_request:

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Linux audio runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 ffmpeg
      - name: Install Python environment
        run: python -m pip install -r requirements-dev.txt
      - name: Install desktop environment
        run: npm ci --ignore-scripts
      - name: Verify versions and dependencies
        run: |
          python tools/check_version.py
          python tools/verify_text_integrity.py
          python tools/verify_docs.py
          python -m pip check
          npm audit --audit-level=high
      - name: Compile and lint Python
        run: |
          python -m compileall -q main.py mariana beta lyrics_provider recommendation_engine tools
          python -m ruff check .
          pyright
      - name: Test Python with branch coverage
        run: >-
          python -m pytest -q
          --cov
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=json:coverage.json
          --cov-branch
          --cov-fail-under=90
          --junitxml=junit.xml
      - name: Enforce new-package branch coverage
        run: python tools/coverage_gate.py coverage.json --minimum 95
      - name: Test and build React terminal
        run: |
          npm run lint
          npm test
          npm run build
      - name: Rebuild native Electron dependencies
        run: npm run rebuild:native
      - name: Test native Electron PTY
        if: runner.os != 'Linux'
        run: npm run test:e2e:dev
      - name: Test native Electron PTY (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e:dev
      - name: Audit locked Python dependencies
        run: python -m pip_audit -r requirements.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ runner.os }}-coverage
          path: |
            coverage.xml
            coverage.json
            junit.xml
            test-results/
            playwright-report/
          if-no-files-found: ignore
