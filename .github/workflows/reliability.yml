name: Scheduled reliability gates

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: mutmut run
      - run: mutmut export-cicd-stats
      - run: python tools/mutation_gate.py --minimum 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results
          path: mutants/

  public-live-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libchromaprint-tools libportaudio2
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -m live --junitxml=live-junit.xml
        env:
          MARIANA_LIVE_TESTS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-live-results
          path: live-junit.xml
