name: Signed desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
      confirmation:
        description: Type PUBLISH to authorize the GitHub Release
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    if: inputs.confirmation == 'PUBLISH'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: windows-latest
            target: win
            arch: x64
            backend: win-x64
          - runner: ubuntu-latest
            target: linux
            arch: x64
            backend: linux-x64
          - runner: macos-14-large
            target: mac
            arch: x64
            backend: mac-x64
          - runner: macos-14-xlarge
            target: mac
            arch: arm64
            backend: mac-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 ffmpeg rpm
      - name: Install macOS media runtime
        if: runner.os == 'macOS'
        run: brew install ffmpeg portaudio
      - name: Install Windows media runtime
        if: runner.os == 'Windows'
        run: choco install ffmpeg --version=8.1.2 -y --no-progress
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - name: Run release verification gates
        run: |
          python tools/check_version.py
          python tools/verify_repository.py
          python tools/verify_text_integrity.py
          python tools/verify_docs.py
          python -m compileall -q main.py mariana beta lyrics_provider recommendation_engine tools
          python -m ruff check .
          pyright
          python -m pytest -q --cov --cov-branch --cov-report=json:coverage.json --cov-fail-under=90
          python tools/coverage_gate.py coverage.json --minimum 95 --repository-minimum 90
          npm run lint
          npm test
      - name: Verify explicit release authorization and signing
        run: python tools/release_preflight.py
        env:
          MARIANA_RELEASE_TAG: ${{ inputs.tag }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Build standalone Python backend
        run: python -m PyInstaller --clean --noconfirm --distpath dist-backend/${{ matrix.backend }} mariana-cli.spec
      - name: Rebuild native Electron dependencies
        run: npm run rebuild:native
      - run: npm run build
      - name: Build unpacked app for PTY acceptance
        run: npx electron-builder --dir --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Locate unpacked application
        run: python tools/locate_packaged_app.py --github-env
      - name: Test packaged Electron PTY
        if: runner.os != 'Linux'
        run: npm run test:e2e:packaged
      - name: Test packaged Electron PTY (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e:packaged
      - name: Build signed desktop artifact
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Sign Linux checksums
        if: runner.os == 'Linux'
        shell: bash
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd release
          sha256sum Mariana-*.AppImage latest-linux.yml > SHA256SUMS
          gpg --batch --yes --armor --detach-sign SHA256SUMS
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
