server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Log the path without OAuth callback parameters.
    access_log off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ready","surface":"web"}';
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }
    location ~ ^/api/(accounts|jam)$ {
        default_type application/json;
        return 503 '{"error":"The native bridge requires the local Mariana Python player."}';
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
