[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402", "E701", "E702", "F401", "F841"]
"beta/mediadl.py" = ["E402", "E701", "E721"]
"beta/podcasts.py" = ["E701"]
"lyrics_provider/detect_song.py" = ["E701"]
"url_validate.py" = ["E701"]
