[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "live: opt-in tests that contact real services or require multimedia hardware",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    ".venv/*",
    "tests/*",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 1
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402", "E701", "E702", "F401", "F841"]
"beta/mediadl.py" = ["E402", "E701", "E721"]
"beta/podcasts.py" = ["E701"]
"lyrics_provider/detect_song.py" = ["E701"]
"url_validate.py" = ["E701"]
